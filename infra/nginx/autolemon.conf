# AutoLemon reverse proxy (owning module: operations) — NOT DEPLOYED / UNVERIFIED example.
# Sits behind the managed WAF (OWASP CRS) and is reachable ONLY through the ZTNA/VPN access
# layer. The application still enforces its own MFA.
server {
  listen 443 ssl;
  http2 on;
  server_name erp.example.internal;

  ssl_certificate     /etc/ssl/autolemon/fullchain.pem;
  ssl_certificate_key /etc/ssl/autolemon/privkey.pem;
  ssl_protocols TLSv1.3;              # TLS 1.2 only with documented justification
  ssl_prefer_server_ciphers off;
  ssl_session_tickets off;

  client_max_body_size 1m;            # matches API CSV import limit
  client_body_timeout 15s;
  large_client_header_buffers 4 8k;
  server_tokens off;

  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options DENY always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Cross-Origin-Opener-Policy same-origin always;

  root /srv/autolemon/web;            # output of `pnpm --filter @autolemon/web build`
  location / { try_files $uri /index.html; }

  location /api/ {
    proxy_pass https://api.autolemon.svc.internal:3000;   # private network, TLS to the app
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/autolemon/internal-ca.pem;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;         # API TRUST_PROXY lists THIS proxy only
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 30s;
  }
}
server { listen 80; return 301 https://$host$request_uri; }
