# Postgres hardening excerpt (owning module: operations) — NOT DEPLOYED / UNVERIFIED example.
listen_addresses = '10.20.30.40'          # private subnet address only; no public IP
ssl = on
ssl_min_protocol_version = 'TLSv1.3'
ssl_cert_file = '/etc/postgresql/tls/server.crt'
ssl_key_file = '/etc/postgresql/tls/server.key'
password_encryption = 'scram-sha-256'
log_connections = on
log_disconnections = on
log_statement = 'ddl'                     # never 'all' (would log data/PII)
archive_mode = on
archive_command = 'pgbackrest --stanza=autolemon archive-push %p'
wal_level = replica
max_wal_senders = 3
