# pgBackRest (owning module: operations) — NOT DEPLOYED / UNVERIFIED example.
# Daily full + continuous WAL (PITR) to an off-site S3-compatible bucket with Object Lock
# (compliance mode) and client-side AES-256 repository encryption. The repo cipher passphrase
# lives in the secrets manager of a SEPARATE account/role from application admins.
[global]
repo1-type=s3
repo1-s3-bucket=autolemon-backups-offsite
repo1-s3-region=eu-south-2
repo1-s3-endpoint=s3.eu-south-2.amazonaws.com
repo1-path=/autolemon
repo1-cipher-type=aes-256-cbc
# repo1-cipher-pass is injected from the secrets manager at runtime (never in this file)
repo1-retention-full=35
repo1-retention-diff=14
start-fast=y
compress-type=zst

[autolemon]
pg1-path=/var/lib/postgresql/18/main
