# AutoLemon ERP — default-deny CI pipeline (owning module: operations / security).
# Every third-party action is pinned to a full commit SHA (tag in comment, verified 2026-11-09).
# Any failing job blocks merge (configure branch protection: require all jobs + human review).
# Production deployment is intentionally absent (DISABLED until configured and approved).
name: ci
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1' # weekly deep checks (property tests, advisories, restore smoke)
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: autolemon_owner
          POSTGRES_PASSWORD: ci_only_owner_password
          POSTGRES_DB: autolemon
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U autolemon_owner" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://autolemon_owner:ci_only_owner_password@127.0.0.1:5432/autolemon
      APP_DATABASE_URL: postgres://autolemon_app:ci_only_app_password_x@127.0.0.1:5432/autolemon
      KEY_PROVIDER: local-dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '22.x', cache: pnpm }
      - name: Generate ephemeral CI secrets (never stored)
        run: |
          echo "LOCAL_DEV_KEKS=ci-kek:$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo "CSRF_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @autolemon/contracts build
      - run: pnpm format:check
      - run: pnpm lint # includes documentation gate
      - run: pnpm typecheck
      - run: pnpm api:check # OpenAPI matches code (the route-inventory test reads it)
      - run: pnpm gate:check # WMS release-gate state machine (fail-closed)
      - run: pnpm test:unit
      - name: Migrations from empty DB (twice → idempotent) and checksum tamper detection
        run: SKIP_DOTENV=1 pnpm db:migrate && SKIP_DOTENV=1 pnpm db:migrate
      - run: SKIP_DOTENV=1 pnpm test:integration
      - run: SKIP_DOTENV=1 pnpm test:security
      - run: pnpm exec playwright install --with-deps chromium
      - run: SKIP_DOTENV=1 pnpm test:e2e
      - run: pnpm security:scan
      - name: Build
        run: pnpm build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: evidence
          path: |
            artifacts/sbom.cdx.json
            playwright-report/
          retention-days: 30

  codeql:
    runs-on: ubuntu-24.04
    permissions: { contents: read, security-events: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with: { languages: javascript-typescript, queries: security-extended }
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3

  secrets-and-iac:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
      - name: Trivy filesystem + IaC + secrets (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with: { scan-type: fs, scanners: 'vuln,misconfig,secret', severity: 'HIGH,CRITICAL', exit-code: '1', ignore-unfixed: true }

  container:
    runs-on: ubuntu-24.04
    needs: verify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: docker build -t autolemon-api:${{ github.sha }} .
      - name: Trivy image scan (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with: { image-ref: 'autolemon-api:${{ github.sha }}', severity: 'HIGH,CRITICAL', exit-code: '1', ignore-unfixed: true }

  # Forward-compatibility: the next Node LTS line must type-check, pass unit tests and build.
  # (DB-backed suites run on the primary Node line in `verify`.)
  node-next:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '26.x', cache: pnpm }
      - run: node --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm build

  # Release candidate archive with SLSA build provenance (GitHub artifact attestation).
  # Runs only on main after EVERY other job passed; it never deploys anything. Verify with:
  #   gh attestation verify AutoLemon-ERP-<version>-WMS.zip --repo <owner>/<repo>
  release-candidate:
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, node-next, codeql, secrets-and-iac, container]
    permissions:
      contents: read
      id-token: write # OIDC token for the Sigstore-backed attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '22.x', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:zip
      - run: pnpm verify:handover
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'artifacts/AutoLemon-ERP-*-WMS.zip'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-candidate
          path: |
            artifacts/AutoLemon-ERP-*-WMS.zip
            artifacts/AutoLemon-ERP-*-WMS.zip.sha256
            artifacts/AutoLemon-ERP-*-WMS.manifest.json
          retention-days: 90
